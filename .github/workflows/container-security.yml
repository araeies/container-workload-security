name: Container image security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan-api-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t container-security-lab-api:${{ github.sha }} ./api

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: container-security-lab-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
